<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogoMock · 印标工作台</title><link rel="stylesheet" href="/web/workspace/workspace.css"></head>
<body>
<header class="topbar"><a class="brand" href="/">◈ <span>LogoMock<small>印标工作台</small></span></a><div class="project-heading"><strong id="project-title">选择一个任务，开始制作</strong><span id="save-state">本地工作空间</span></div><button id="settings-button">⚙ 设置</button><button id="primary-top-action" class="primary">新建任务</button></header>
<div id="error-banner" role="alert" hidden><span id="error-message"></span><button id="retry-button" hidden>重试保存</button><button id="reopen-button" hidden>重新打开</button><button id="dismiss-error">×</button></div>
<main class="workspace">
<aside class="left-panel"><div class="panel-label">任务 <button id="new-project" class="small-button" title="新建任务">＋ 新建</button></div><div class="project-tools"><input id="project-search" placeholder="搜索任务…" aria-label="搜索任务"><button id="refresh-projects" title="刷新任务">↻</button></div><div id="project-list" class="project-list"></div><div class="left-tabs" role="tablist"><button id="assets-tab" class="active" role="tab" aria-selected="true">素材</button><button id="versions-tab" role="tab" aria-selected="false">版本记录</button></div><div id="assets-view" class="left-tab-view"><div class="assets-heading panel-label">当前任务 <button id="clone-project" class="small-button" disabled>复制任务</button></div><div id="assets-panel"></div></div><div id="versions-view" class="left-tab-view" hidden></div><div class="local-note"><span class="status-dot"></span>文件保存在本机<div id="engine-status">检查导出引擎…</div></div></aside>
<section class="center-panel"><div class="editor-toolbar"><div class="tool-group"><button id="tool-select" class="active" title="选择 / V">↖ 选择</button><button id="tool-product" title="绘制产品尺寸框">▣ 产品框</button><button id="tool-frame" title="绘制印标参考框">▧ 印标区域</button><button id="tool-crop" title="绘制独立裁剪框">⌗ 裁剪</button></div><div class="tool-group"><button id="undo-button" title="撤销 Ctrl+Z">↶</button><button id="redo-button" title="重做 Ctrl+Shift+Z">↷</button><button id="preview-button">◉ 预览</button></div></div><div id="editor-host"><svg id="editor" xmlns="http://www.w3.org/2000/svg" aria-label="产品排版画布"></svg><div id="canvas-empty" class="canvas-empty"><div class="empty-icon">▧</div><h1>从一张产品图开始</h1><p>新建任务后，导入产品图与 Logo。</p><button id="empty-create" class="primary">＋ 新建任务</button></div><div class="viewport-controls"><span id="zoom-label">100%</span><button id="zoom-out">−</button><button id="zoom-in">＋</button><button id="fit-button">适合画布</button></div><div class="canvas-help">滚轮缩放 · 空格 / 中键拖动画布</div></div></section>
<aside class="right-panel"><div class="panel-label">属性 <span id="selection-kind">未选择</span></div><div id="properties"></div><div id="primary-action-area" class="primary-action-area"></div></aside>
</main><div id="busy-overlay" hidden><div class="busy-card"><span class="spinner"></span><span id="busy-label">处理中…</span></div></div><dialog id="dialog"><div id="dialog-content"></div></dialog><script type="module" src="/web/workspace/main.mjs?v=internal-v2"></script></body></html>
