<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogoMock · 印标工作台</title><link rel="stylesheet" href="/web/workspace/workspace.css"></head>
<body>
<header class="topbar"><a class="brand" href="/">◈ <span>LogoMock<small>印标工作台</small></span></a><div class="project-heading"><strong id="project-title">选择一个项目，开始制作</strong><span id="save-state">本地工作空间</span></div><button id="settings-button">⚙ 设置</button><button id="export-button" class="primary" disabled>导出文件 ↗</button></header>
<div id="error-banner" role="alert" hidden><span id="error-message"></span><button id="retry-button" hidden>重试保存</button><button id="reopen-button" hidden>重新打开</button><button id="dismiss-error">×</button></div>
<main class="workspace">
<aside class="left-panel"><div class="panel-label">项目 <button id="new-project" class="small-button" title="新建项目">＋ 新建</button></div><div class="project-tools"><input id="project-search" placeholder="搜索项目…" aria-label="搜索项目"><button id="refresh-projects" title="刷新项目">↻</button></div><div id="project-list" class="project-list"></div><div class="assets-heading panel-label">项目素材 <button id="clone-project" class="small-button" disabled>复制项目</button></div><div id="assets-panel"></div><div class="local-note"><span class="status-dot"></span>文件保存在本机<div id="engine-status">检查导出引擎…</div></div></aside>
<section class="center-panel"><div class="editor-toolbar"><div class="tool-group"><button id="tool-select" class="active" title="选择 / V">↖ 选择</button><button id="tool-product" title="绘制产品尺寸框">▣ 产品框</button><button id="tool-frame" title="绘制印标参考框">▧ 参考框</button><button id="tool-crop" title="绘制独立裁剪框">⌗ 裁剪</button></div><div class="tool-group"><button id="undo-button" title="撤销 Ctrl+Z">↶</button><button id="redo-button" title="重做 Ctrl+Shift+Z">↷</button><button id="preview-button">◉ 预览</button></div></div><div id="editor-host"><svg id="editor" xmlns="http://www.w3.org/2000/svg" aria-label="产品排版画布"></svg><div id="canvas-empty" class="canvas-empty"><div class="empty-icon">▧</div><h1>让每一枚标志，落在对的位置</h1><p>新建或打开项目，导入产品图片与品牌标志。<br>按真实尺寸排版，再导出生产文件。</p><button id="empty-create" class="primary">＋ 新建项目</button><span>本地制作 · 毫米级定位 · 干净导出</span></div><div class="viewport-controls"><span id="zoom-label">100%</span><button id="zoom-out">−</button><button id="zoom-in">＋</button><button id="fit-button">适合画布</button></div><div class="canvas-help">滚轮缩放 · 空格 / 中键拖动画布</div></div><div class="schemes-header"><span>排版方案 <small id="scheme-count">0</small></span><button id="add-scheme" class="small-button" disabled>＋ 新建方案</button></div><div id="scheme-list" class="scheme-list"></div></section>
<aside class="right-panel"><div class="panel-label">属性 <span id="selection-kind">未选择</span></div><div id="properties"></div><div class="workflow-hint"><strong>制作提示</strong><p>① 导入产品图与 Logo<br>② 校准产品真实宽度<br>③ 选择印标区域，调整方案<br>④ 检查并导出</p></div></aside>
</main><div id="busy-overlay" hidden><div class="busy-card"><span class="spinner"></span><span id="busy-label">处理中…</span></div></div><dialog id="dialog"><div id="dialog-content"></div></dialog><script type="module" src="/web/workspace/main.mjs?v=internal-v1"></script></body></html>
